<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floreser Detalles</title>

<style>
body {

  margin: 0;
  background: #f5f5f5;
}

.header {
  text-align: center;
  padding: 20px;
  background: #f8d7da;
}

.header img {
  width: 90px;
  border-radius: 50%;

.producto {

  width:250px;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.producto img {
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
  <img src="./logo.png">
  <h1>Floreser Detalles 🌸</h1>
  <p>Haz tu pedido por WhatsApp</p>

  <a href="https://wa.me/573247029744">
    <button class="btn">Escribir por WhatsApp</button>
  </a>
</div>

<div class="contenedor">

  <div class="producto">
    <img src="./01.jpg">
    <h3>Ramo de rosas 🌹</h3>
    <p>Desde $35.000</p>
  </div>

  <div class="producto">
    <img src="./02.jpg">

</html>
